name: Build RTranslator 3 Lite

on:
  push:
    branches:
      - rtranslator-lite-build
    paths:
      - '.github/workflows/build-rtranslator-lite.yml'
      - 'rtranslator-lite/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.0.12674087' \
            'cmake;3.22.1'

      - name: Clone RTranslator v3.00
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch v3.00 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/niedev/RTranslator.git RTranslator

      - name: Apply Lite7 patches
        shell: bash
        run: |
          python3 rtranslator-lite/patch_low_memory.py RTranslator
          python3 rtranslator-lite/patch_lite5_identity.py RTranslator
          python3 rtranslator-lite/patch_lite6_real_downloader.py RTranslator
          python3 rtranslator-lite/patch_lite7_walkie_safety.py RTranslator

          echo '--- translation backend ---'
          grep -n 'Int4Acc4\|RTranslatorLite\|boolean arena' \
            RTranslator/app/src/main/java/nie/translator/rtranslator/voice_translation/neural_networks/translation/Translator.java

          echo '--- ACTIVE onboarding: DownloadFragment2 must still be Whisper only ---'
          ACTIVE=RTranslator/app/src/main/java/nie/translator/rtranslator/access/DownloadFragment2.java
          NLLB_COUNT=$(grep -c '"NLLB_.*\.onnx"' "$ACTIVE" || true)
          MODEL_COUNT=$(grep -c 'new DownloadInfo(' "$ACTIVE" || true)
          echo "Active downloader NLLB entries: $NLLB_COUNT"
          echo "Active downloader model objects: $MODEL_COUNT"
          test "$NLLB_COUNT" -eq 0
          test "$MODEL_COUNT" -eq 6
          grep -n 'LITE7 | ACTIVE Downloader2 | Whisper only' "$ACTIVE"

          echo '--- WalkieTalkie safety ---'
          VTA=RTranslator/app/src/main/java/nie/translator/rtranslator/voice_translation/VoiceTranslationActivity.java
          grep -n 'REQUEST_CODE_WALKIE_TALKIE_MIC_PERMISSION' "$VTA"
          grep -n 'checkSelfPermission(Manifest.permission.RECORD_AUDIO)' "$VTA"
          grep -n 'savedFragment == WALKIE_TALKIE_FRAGMENT' "$VTA"
          grep -n 'fragmentToPersist == WALKIE_TALKIE_FRAGMENT' "$VTA"
          grep -n 'startForegroundService(intent)' "$VTA"
          grep -n 'RTranslatorLite7' "$VTA"
          grep -n 'intent.putExtra("notification", notification)' "$VTA"

          echo '--- package/version ---'
          grep -n 'applicationId\|versionCode\|versionName' RTranslator/app/build.gradle | head
          grep -q 'applicationId "nie.translator.rtranslator.lite7"' RTranslator/app/build.gradle
          grep -q "versionName '3.0.0-alpha3-lite7'" RTranslator/app/build.gradle
          grep -R -q 'RTranslator Lite7' RTranslator/app/src/main/res/values*/strings.xml

      - name: Configure Android SDK path
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > RTranslator/local.properties

      - name: Build debug APK
        working-directory: RTranslator
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify built APK markers
        shell: bash
        run: |
          APK=RTranslator/app/build/outputs/apk/debug/app-debug.apk
          rm -rf apkcheck apk-strings.txt
          unzip -q "$APK" -d apkcheck
          strings apkcheck/classes*.dex > apk-strings.txt
          grep -q 'LITE7 | ACTIVE Downloader2 | Whisper only' apk-strings.txt
          grep -q 'REQUEST_CODE_WALKIE_TALKIE_MIC_PERMISSION' apk-strings.txt || true
          grep -q 'RTranslatorLite7' apk-strings.txt
          grep -q 'nie.translator.rtranslator.lite7' apk-strings.txt
          echo 'Built APK contains Lite7 active-downloader and WalkieTalkie safety markers.'

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp RTranslator/app/build/outputs/apk/debug/app-debug.apk \
             out/RTranslator-3.0.0-alpha3-lite7-debug.apk
          sha256sum out/RTranslator-3.0.0-alpha3-lite7-debug.apk | tee out/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTranslator-3.0.0-alpha3-lite7
          path: out/*
          if-no-files-found: error
          retention-days: 14
