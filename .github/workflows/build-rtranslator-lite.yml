name: Build RTranslator 3 Lite

on:
  push:
    branches:
      - rtranslator-lite-build
    paths:
      - '.github/workflows/build-rtranslator-lite.yml'
      - 'rtranslator-lite/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.0.12674087' \
            'cmake;3.22.1'

      - name: Clone RTranslator v3.00
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch v3.00 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/niedev/RTranslator.git RTranslator

      - name: Prepare ORT bridge, sherpa AAR and INT8 ASR assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p RTranslator/app/libs

          echo '=== sherpa-onnx Android AAR 1.13.5 / ORT core 1.27.1 ==='
          curl -fL --retry 3 -o sherpa.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
          echo '6419cd8bc983e0c4fab06067f0fe0313fdc0f7103818ac1e7a08d50787b7a82b  sherpa.aar' | sha256sum -c -

          rm -rf sherpa-aar
          mkdir sherpa-aar
          unzip -q sherpa.aar -d sherpa-aar

          # Keep sherpa's newer ORT core. Only remove ABIs that cannot execute our bundled ASR.
          find sherpa-aar/jni -mindepth 1 -maxdepth 1 -type d ! -name arm64-v8a -exec rm -rf {} +
          test -f sherpa-aar/jni/arm64-v8a/libonnxruntime.so
          test -f sherpa-aar/jni/arm64-v8a/libsherpa-onnx-jni.so
          test -f sherpa-aar/jni/arm64-v8a/libsherpa-onnx-c-api.so
          sha256sum sherpa-aar/jni/arm64-v8a/libonnxruntime.so
          sha256sum sherpa-aar/jni/arm64-v8a/libonnxruntime.so | awk '{print $1}' > sherpa-core.sha256
          (cd sherpa-aar && zip -qr ../RTranslator/app/libs/sherpa-onnx-1.13.5-core-arm64.aar .)

          echo '=== ONNX Runtime Android 1.24.3 Java/JNI bridge ==='
          ORT_URL=https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.24.3/onnxruntime-android-1.24.3.aar
          curl -fL --retry 3 -o ort.aar "$ORT_URL"
          curl -fsSL --retry 3 -o ort.aar.sha1 "$ORT_URL.sha1"
          printf '%s  ort.aar\n' "$(tr -d '[:space:]' < ort.aar.sha1)" | sha1sum -c -

          rm -rf ort-aar
          mkdir ort-aar
          unzip -q ort.aar -d ort-aar
          test -f ort-aar/classes.jar
          find ort-aar/jni -mindepth 1 -maxdepth 1 -type d ! -name arm64-v8a -exec rm -rf {} +
          test -f ort-aar/jni/arm64-v8a/libonnxruntime.so
          test -f ort-aar/jni/arm64-v8a/libonnxruntime4j_jni.so

          # The Java/JNI wrapper may be older than sherpa's ORT core; keep the wrapper,
          # remove only the 1.24.3 core so the process loads exactly one libonnxruntime.so.
          rm -f ort-aar/jni/arm64-v8a/libonnxruntime.so
          test ! -f ort-aar/jni/arm64-v8a/libonnxruntime.so
          test -f ort-aar/jni/arm64-v8a/libonnxruntime4j_jni.so
          echo '--- ORT Java JNI dynamic dependencies ---'
          readelf -d ort-aar/jni/arm64-v8a/libonnxruntime4j_jni.so | grep NEEDED || true
          echo '--- sherpa JNI dynamic dependencies ---'
          readelf -d sherpa-aar/jni/arm64-v8a/libsherpa-onnx-jni.so | grep NEEDED || true
          (cd ort-aar && zip -qr ../RTranslator/app/libs/onnxruntime-android-1.24.3-no-core-arm64.aar .)

          echo '=== official multilingual Whisper Small ==='
          curl -fL --retry 3 -o whisper-small.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2
          echo '486a46afbb7ba798507190ffe02fea2dd726049af212e774537efac6afb210a6  whisper-small.tar.bz2' | sha256sum -c -
          rm -rf whisper-model
          mkdir whisper-model
          tar -xjf whisper-small.tar.bz2 -C whisper-model

          SRC=whisper-model/sherpa-onnx-whisper-small
          DST=RTranslator/app/src/main/assets/sherpa
          mkdir -p "$DST"
          cp "$SRC/small-encoder.int8.onnx" "$DST/"
          cp "$SRC/small-decoder.int8.onnx" "$DST/"
          cp "$SRC/small-tokens.txt" "$DST/"

          echo '=== Silero VAD INT8 ==='
          curl -fL --retry 3 -o "$DST/silero_vad.int8.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.int8.onnx
          echo 'c36d490aff5ab924ca6c7aeec4d8f6bd3d22db6fa17611b9c5b17eae58ac3a20  '"$DST/silero_vad.int8.onnx" | sha256sum -c -

          echo '=== bundled ASR payload ==='
          find "$DST" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test "$(stat -c%s "$DST/small-encoder.int8.onnx")" -eq 112442483
          test "$(stat -c%s "$DST/small-decoder.int8.onnx")" -eq 262226114
          test "$(stat -c%s "$DST/small-tokens.txt")" -eq 816730
          test "$(stat -c%s "$DST/silero_vad.int8.onnx")" -eq 212860

      - name: Apply Lite8 patches
        shell: bash
        run: |
          set -euxo pipefail
          python3 rtranslator-lite/patch_low_memory.py RTranslator
          python3 rtranslator-lite/patch_lite5_identity.py RTranslator
          python3 rtranslator-lite/patch_lite6_real_downloader.py RTranslator
          python3 rtranslator-lite/patch_lite7_walkie_safety.py RTranslator
          python3 rtranslator-lite/patch_lite8_sherpa_asr.py RTranslator
          python3 rtranslator-lite/patch_lite8_ort_bridge.py RTranslator

          echo '--- MADLAD translation backend stays active ---'
          grep -n 'Int4Acc4\|RTranslatorLite\|boolean arena' \
            RTranslator/app/src/main/java/nie/translator/rtranslator/voice_translation/neural_networks/translation/Translator.java

          echo '--- sherpa ASR replacement ---'
          REC=RTranslator/app/src/main/java/nie/translator/rtranslator/voice_translation/neural_networks/voice/Recognizer.java
          grep -n 'OfflineRecognizer' "$REC"
          grep -n 'SileroVadModelConfig' "$REC"
          grep -n 'small-encoder.int8.onnx' "$REC"
          grep -n 'small-decoder.int8.onnx' "$REC"
          grep -n 'One multilingual Whisper pass' "$REC"
          grep -n 'whisperConfig.setLanguage("")' "$REC"

          echo '--- legacy downloader must be unreachable ---'
          ACCESS=RTranslator/app/src/main/java/nie/translator/rtranslator/access/AccessActivity.java
          grep -n 'Lite8: sherpa Whisper INT8' "$ACCESS"
          ! grep -A20 'case DOWNLOAD_FRAGMENT' "$ACCESS" | grep -q 'new DownloadFragment2'

          echo '--- WalkieTalkie safety retained ---'
          VTA=RTranslator/app/src/main/java/nie/translator/rtranslator/voice_translation/VoiceTranslationActivity.java
          grep -n 'REQUEST_CODE_WALKIE_TALKIE_MIC_PERMISSION' "$VTA"
          grep -n 'checkSelfPermission(Manifest.permission.RECORD_AUDIO)' "$VTA"
          grep -n 'savedFragment == WALKIE_TALKIE_FRAGMENT' "$VTA"
          grep -n 'startForegroundService(intent)' "$VTA"
          grep -n 'RTranslatorLite8' "$VTA"

          echo '--- ORT bridge / AAR / package ---'
          ! grep -q 'onnxruntime-android:1.27.1' RTranslator/app/build.gradle
          grep -n 'onnxruntime-android-1.24.3-no-core-arm64.aar' RTranslator/app/build.gradle
          grep -n 'sherpa-onnx-1.13.5-core-arm64.aar' RTranslator/app/build.gradle
          grep -n 'kotlin-stdlib:1.7.20' RTranslator/app/build.gradle
          grep -n "noCompress 'onnx', 'txt'" RTranslator/app/build.gradle
          grep -q 'applicationId "nie.translator.rtranslator.lite8"' RTranslator/app/build.gradle
          grep -q "versionName '3.0.0-alpha3-lite8'" RTranslator/app/build.gradle
          grep -R -q 'RTranslator Lite8' RTranslator/app/src/main/res/values*/strings.xml

      - name: Configure Android SDK path
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > RTranslator/local.properties

      - name: Build debug APK
        working-directory: RTranslator
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify built Lite8 APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=RTranslator/app/build/outputs/apk/debug/app-debug.apk
          rm -rf apkcheck apk-strings.txt apk-badging.txt
          unzip -q "$APK" -d apkcheck
          strings apkcheck/classes*.dex > apk-strings.txt

          echo '--- Java/Dex sherpa markers ---'
          grep -q 'RTranslatorLite8' apk-strings.txt
          grep -q 'small-encoder.int8.onnx' apk-strings.txt
          grep -q 'small-decoder.int8.onnx' apk-strings.txt
          grep -q 'silero_vad.int8.onnx' apk-strings.txt

          echo '--- bundled models ---'
          test -f apkcheck/assets/sherpa/small-encoder.int8.onnx
          test -f apkcheck/assets/sherpa/small-decoder.int8.onnx
          test -f apkcheck/assets/sherpa/small-tokens.txt
          test -f apkcheck/assets/sherpa/silero_vad.int8.onnx
          test "$(stat -c%s apkcheck/assets/sherpa/small-encoder.int8.onnx)" -eq 112442483
          test "$(stat -c%s apkcheck/assets/sherpa/small-decoder.int8.onnx)" -eq 262226114

          echo '--- native libraries: one ORT core + Java JNI + sherpa JNI ---'
          test -f apkcheck/lib/arm64-v8a/libonnxruntime.so
          test -f apkcheck/lib/arm64-v8a/libonnxruntime4j_jni.so
          test -f apkcheck/lib/arm64-v8a/libsherpa-onnx-jni.so
          test -f apkcheck/lib/arm64-v8a/libsherpa-onnx-c-api.so
          ORT_COUNT=$(find apkcheck/lib -type f -name 'libonnxruntime.so' | wc -l)
          ORT_JNI_COUNT=$(find apkcheck/lib -type f -name 'libonnxruntime4j_jni.so' | wc -l)
          echo "libonnxruntime.so count: $ORT_COUNT"
          echo "libonnxruntime4j_jni.so count: $ORT_JNI_COUNT"
          test "$ORT_COUNT" -eq 1
          test "$ORT_JNI_COUNT" -eq 1

          # Prove the packaged core is byte-for-byte the ORT core shipped by sherpa 1.13.5.
          printf '%s  apkcheck/lib/arm64-v8a/libonnxruntime.so\n' "$(cat sherpa-core.sha256)" | sha256sum -c -
          find apkcheck/lib/arm64-v8a -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | grep -E 'onnx|sherpa|ucd|kaldi'

          echo '--- manifest metadata ---'
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='nie.translator.rtranslator.lite8'" apk-badging.txt
          grep -q "application-label:'RTranslator Lite8'" apk-badging.txt

          echo 'Lite8 APK verified: INT8 sherpa ASR assets, JNI bridge and single ORT 1.27.1 core are present.'

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp RTranslator/app/build/outputs/apk/debug/app-debug.apk \
             out/RTranslator-3.0.0-alpha3-lite8-sherpa-debug.apk
          sha256sum out/RTranslator-3.0.0-alpha3-lite8-sherpa-debug.apk | tee out/SHA256SUMS.txt
          ls -lh out/*

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTranslator-3.0.0-alpha3-lite8-sherpa
          path: out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
