name: Build RTranslator 3 Lite

on:
  push:
    branches:
      - rtranslator-lite-build
    paths:
      - '.github/workflows/build-rtranslator-lite.yml'
      - 'rtranslator-lite/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-madlad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official Madlad.zip
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o Madlad.zip \
            https://github.com/niedev/OnnxModelsEnhancer/releases/download/v1.0.0-beta/Madlad.zip
          ls -lh Madlad.zip
          sha256sum Madlad.zip

      - name: List model files
        shell: bash
        run: |
          unzip -l Madlad.zip | tee madlad-files.txt
          echo '--- INT4 entries ---'
          grep -Ei 'int4|4bit' madlad-files.txt || true
          echo '--- INT8 entries ---'
          grep -Ei 'int8|8bit' madlad-files.txt || true

      - name: Upload model listing
        uses: actions/upload-artifact@v4
        with:
          name: madlad-package-listing
          path: madlad-files.txt
          retention-days: 2

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.0.12674087' \
            'cmake;3.22.1'

      - name: Clone RTranslator v3.00
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch v3.00 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/niedev/RTranslator.git RTranslator

      - name: Apply low-memory patch
        shell: bash
        run: |
          python3 rtranslator-lite/patch_low_memory.py RTranslator
          grep -n 'RTranslatorLite\|Int4_16\|boolean arena' \
            RTranslator/app/src/main/java/nie/translator/rtranslator/voice_translation/neural_networks/translation/Translator.java
          grep -n 'applicationId\|versionCode\|versionName' RTranslator/app/build.gradle | head

      - name: Configure Android SDK path
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > RTranslator/local.properties

      - name: Build debug APK
        working-directory: RTranslator
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp RTranslator/app/build/outputs/apk/debug/app-debug.apk \
             out/RTranslator-3.0.0-alpha3-lite-debug.apk
          sha256sum out/RTranslator-3.0.0-alpha3-lite-debug.apk | tee out/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTranslator-3.0.0-alpha3-lite
          path: out/*
          if-no-files-found: error
          retention-days: 14
