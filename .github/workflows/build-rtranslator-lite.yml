name: Build RTranslator 3 Lite

on:
  push:
    branches:
      - rtranslator-lite-build
    paths:
      - '.github/workflows/build-rtranslator-lite.yml'
      - 'rtranslator-lite/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.0.12674087' \
            'cmake;3.22.1'

      - name: Clone RTranslator v3.00
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch v3.00 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/niedev/RTranslator.git RTranslator

      - name: Apply Lite6 patches
        shell: bash
        run: |
          python3 rtranslator-lite/patch_low_memory.py RTranslator
          python3 rtranslator-lite/patch_lite5_identity.py RTranslator
          python3 rtranslator-lite/patch_lite6_real_downloader.py RTranslator

          echo '--- translation backend ---'
          grep -n 'Int4Acc4\|RTranslatorLite\|boolean arena' \
            RTranslator/app/src/main/java/nie/translator/rtranslator/voice_translation/neural_networks/translation/Translator.java

          echo '--- prove AccessActivity uses DownloadFragment2 ---'
          grep -n 'new DownloadFragment2' \
            RTranslator/app/src/main/java/nie/translator/rtranslator/access/AccessActivity.java

          echo '--- ACTIVE onboarding: DownloadFragment2 must be Whisper only ---'
          ACTIVE=RTranslator/app/src/main/java/nie/translator/rtranslator/access/DownloadFragment2.java
          grep -n 'new DownloadInfo\|Whisper_\|NLLB_' "$ACTIVE"

          NLLB_COUNT=$(grep -c '"NLLB_.*\.onnx"' "$ACTIVE" || true)
          MODEL_COUNT=$(grep -c 'new DownloadInfo(' "$ACTIVE" || true)
          echo "Active downloader NLLB entries: $NLLB_COUNT"
          echo "Active downloader model objects: $MODEL_COUNT"
          test "$NLLB_COUNT" -eq 0
          test "$MODEL_COUNT" -eq 6

          for MODEL in \
            Whisper_cache_initializer.onnx \
            Whisper_cache_initializer_batch.onnx \
            Whisper_decoder.onnx \
            Whisper_detokenizer.onnx \
            Whisper_encoder.onnx \
            Whisper_initializer.onnx; do
            grep -q "\"$MODEL\"" "$ACTIVE"
          done

          echo '--- visible Lite6 marker must be in ACTIVE downloader ---'
          grep -n 'LITE6 | ACTIVE Downloader2 | Whisper only' "$ACTIVE"

          echo '--- package/version ---'
          grep -n 'applicationId\|versionCode\|versionName' RTranslator/app/build.gradle | head
          grep -q 'applicationId "nie.translator.rtranslator.lite6"' RTranslator/app/build.gradle
          grep -q "versionName '3.0.0-alpha3-lite6'" RTranslator/app/build.gradle

          echo '--- app labels ---'
          grep -R '<string name="app_name"' RTranslator/app/src/main/res/values* | head -20
          grep -R -q 'RTranslator Lite6' RTranslator/app/src/main/res/values*/strings.xml

      - name: Configure Android SDK path
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > RTranslator/local.properties

      - name: Build debug APK
        working-directory: RTranslator
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify built APK markers
        shell: bash
        run: |
          APK=RTranslator/app/build/outputs/apk/debug/app-debug.apk
          unzip -q "$APK" -d apkcheck
          strings apkcheck/classes*.dex > apk-strings.txt
          grep -q 'LITE6 | ACTIVE Downloader2 | Whisper only' apk-strings.txt
          grep -q 'Whisper_decoder.onnx' apk-strings.txt
          echo 'Built APK contains Lite6 active-downloader marker.'

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp RTranslator/app/build/outputs/apk/debug/app-debug.apk \
             out/RTranslator-3.0.0-alpha3-lite6-debug.apk
          sha256sum out/RTranslator-3.0.0-alpha3-lite6-debug.apk | tee out/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTranslator-3.0.0-alpha3-lite6
          path: out/*
          if-no-files-found: error
          retention-days: 14
