name: Build RTranslator 3 Lite13 GGUF Loader

on:
  push:
    branches: [rtranslator-lite-build]
    paths:
      - '.github/workflows/build-rtranslator-lite13.yml'
      - 'rtranslator-lite/patch_lite13_gguf_loader.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
      LLAMA_COMMIT: 0b1bad14ff204627636aeb1de22ddcd5acb859d4
      TESSDATA_COMMIT: 87416418657359cb625c412a48b6e1d6d41c29bd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.12674087' 'cmake;3.22.1' 'cmake;3.31.6'

      - name: Clone RTranslator v3.00
        shell: bash
        run: |
          git clone --depth 1 --branch v3.00 --recurse-submodules --shallow-submodules \
            https://github.com/niedev/RTranslator.git RTranslator

      - name: Prepare ORT, Sherpa ASR and OCR assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p RTranslator/app/libs

          curl -fL --retry 3 -o sherpa.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
          echo '6419cd8bc983e0c4fab06067f0fe0313fdc0f7103818ac1e7a08d50787b7a82b  sherpa.aar' | sha256sum -c -
          rm -rf sherpa-aar && mkdir sherpa-aar
          unzip -q sherpa.aar -d sherpa-aar
          find sherpa-aar/jni -mindepth 1 -maxdepth 1 -type d ! -name arm64-v8a -exec rm -rf {} +
          rm -f sherpa-aar/jni/arm64-v8a/libonnxruntime.so sherpa-aar/jni/arm64-v8a/libonnxruntime4j_jni.so
          (cd sherpa-aar && zip -qr ../RTranslator/app/libs/sherpa-onnx-1.13.5-no-ort-arm64.aar .)

          curl -fL --retry 3 -o ort.zip \
            https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.27.1/onnxruntime-android-1.27.1.zip
          echo 'defade26209f72cf4fa9769b18052c842833d6bef12924595d26f03b995548ca  ort.zip' | sha256sum -c -
          rm -rf ort-aar && mkdir ort-aar
          unzip -q ort.zip -d ort-aar
          find ort-aar/jni -mindepth 1 -maxdepth 1 -type d ! -name arm64-v8a -exec rm -rf {} +
          (cd ort-aar && zip -qr ../RTranslator/app/libs/onnxruntime-android-1.27.1-full-arm64.aar .)

          curl -fL --retry 3 -o whisper.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2
          echo '486a46afbb7ba798507190ffe02fea2dd726049af212e774537efac6afb210a6  whisper.tar.bz2' | sha256sum -c -
          mkdir whisper-model && tar -xjf whisper.tar.bz2 -C whisper-model
          SRC=whisper-model/sherpa-onnx-whisper-small
          DST=RTranslator/app/src/main/assets/sherpa
          mkdir -p "$DST"
          cp "$SRC/small-encoder.int8.onnx" "$DST/"
          cp "$SRC/small-decoder.int8.onnx" "$DST/"
          cp "$SRC/small-tokens.txt" "$DST/"
          curl -fL --retry 3 -o "$DST/silero_vad.int8.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.int8.onnx

          TDST=RTranslator/app/src/main/assets/tessdata
          mkdir -p "$TDST"
          for LANG in eng deu rus ukr srp mkd; do
            curl -fL --retry 3 -o "$TDST/$LANG.traineddata" \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$TESSDATA_COMMIT/$LANG.traineddata"
          done

      - name: Build Lite13 llama.cpp Android AAR
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git checkout "$LLAMA_COMMIT"

          LIB=examples/llama.android/lib
          GRADLE="$LIB/build.gradle.kts"
          CPP="$LIB/src/main/cpp/ai_chat.cpp"
          LOGGING="$LIB/src/main/cpp/logging.h"
          ENGINE="$LIB/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt"

          sed -i 's/ndkVersion = "29.0.13113456"/ndkVersion = "28.0.12674087"/' "$GRADLE"
          sed -i 's/minSdk = 33/minSdk = 28/' "$GRADLE"
          sed -i 's/abiFilters += listOf("arm64-v8a", "x86_64")/abiFilters += listOf("arm64-v8a")/' "$GRADLE"
          sed -i 's/-DGGML_CPU_ALL_VARIANTS=ON/-DGGML_CPU_ALL_VARIANTS=OFF/' "$GRADLE"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('examples/llama.android/lib/src/main/cpp/logging.h')
          s=p.read_text()
          s=s.replace('''static inline int ai_should_log(int prio) {
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          }''','''static inline int ai_should_log(int prio) {
          #if __ANDROID_API__ >= 30
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          #else
              return prio >= LOG_MIN_LEVEL;
          #endif
          }''',1)
          p.write_text(s)
          PY

          sed -i 's/DEFAULT_CONTEXT_SIZE    = 8192/DEFAULT_CONTEXT_SIZE    = 2048/' "$CPP"
          sed -i 's/BATCH_SIZE              = 512/BATCH_SIZE              = 64/' "$CPP"
          sed -i 's/DEFAULT_SAMPLER_TEMP    = 0.3f/DEFAULT_SAMPLER_TEMP    = 0.0f/' "$CPP"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          s=p.read_text()

          s=s.replace('#include <string>\n', '#include <string>\n#include <algorithm>\n', 1)
          s=s.replace('''static llama_batch                        g_batch;
          static common_chat_templates_ptr          g_chat_templates;''','''static llama_batch                        g_batch;
          static bool                               g_batch_initialized = false;
          static common_chat_templates_ptr          g_chat_templates;
          static std::string                        g_last_native_log;

          static void lite13_log_callback(enum ggml_log_level level, const char * text, void * user) {
              aichat_android_log_callback(level, text, user);
              if (level == GGML_LOG_LEVEL_ERROR || level == GGML_LOG_LEVEL_WARN) {
                  if (g_last_native_log.size() > 6000) {
                      g_last_native_log.erase(0, g_last_native_log.size() - 4000);
                  }
                  g_last_native_log += text == nullptr ? "" : text;
              }
          }''',1)

          s=s.replace('llama_log_set(aichat_android_log_callback, nullptr);', 'llama_log_set(lite13_log_callback, nullptr);', 1)

          old='''    llama_model_params model_params = llama_model_default_params();

              const auto *model_path = env->GetStringUTFChars(jmodel_path, 0);
              LOGd("%s: Loading model from: \\n%s\\n", __func__, model_path);

              auto *model = llama_model_load_from_file(model_path, model_params);
              env->ReleaseStringUTFChars(jmodel_path, model_path);
              if (!model) {
                  return 1;
              }
              g_model = model;
              return 0;'''
          new='''    llama_model_params model_params = llama_model_default_params();
              g_last_native_log.clear();

              const auto *model_path = env->GetStringUTFChars(jmodel_path, 0);
              LOGd("%s: Loading model from: \\n%s\\n", __func__, model_path);

              auto *model = llama_model_load_from_file(model_path, model_params);
              if (!model) {
                  const std::string first_error = g_last_native_log;
                  LOGw("Initial GGUF load failed; retrying without mmap");
                  g_last_native_log = first_error + "\\n--- retry with load_mode=LLAMA_LOAD_MODE_NONE ---\\n";
                  model_params.load_mode = LLAMA_LOAD_MODE_NONE;
                  model = llama_model_load_from_file(model_path, model_params);
              }
              env->ReleaseStringUTFChars(jmodel_path, model_path);
              if (!model) {
                  if (g_last_native_log.empty()) g_last_native_log = "llama_model_load_from_file returned null";
                  return 1;
              }
              g_model = model;
              return 0;'''
          if old not in s: raise SystemExit('native load block missing')
          s=s.replace(old,new,1)

          marker='''static llama_context *init_context'''
          pos=s.find(marker)
          if pos < 0: raise SystemExit('init_context marker missing')
          jni='''extern "C"\nJNIEXPORT jstring JNICALL\nJava_com_arm_aichat_internal_InferenceEngineImpl_lastNativeError(JNIEnv *env, jobject /*unused*/) {\n    return env->NewStringUTF(g_last_native_log.c_str());\n}\n\n'''
          s=s[:pos]+jni+s[pos:]

          s=s.replace('''    g_batch = llama_batch_init(BATCH_SIZE, 0, 1);
              g_chat_templates = common_chat_templates_init(g_model, "");''','''    g_batch = llama_batch_init(BATCH_SIZE, 0, 1);
              g_batch_initialized = true;
              g_chat_templates = common_chat_templates_init(g_model, "");''',1)

          old_unload='''Java_com_arm_aichat_internal_InferenceEngineImpl_unload(JNIEnv * /*unused*/, jobject /*unused*/) {
              // Reset long-term & short-term states
              reset_long_term_states();
              reset_short_term_states();

              // Free up resources
              common_sampler_free(g_sampler);
              g_chat_templates.reset();
              llama_batch_free(g_batch);
              llama_free(g_context);
              llama_model_free(g_model);
          }'''
          new_unload='''Java_com_arm_aichat_internal_InferenceEngineImpl_unload(JNIEnv * /*unused*/, jobject /*unused*/) {
              reset_long_term_states(false);
              reset_short_term_states();
              if (g_sampler != nullptr) { common_sampler_free(g_sampler); g_sampler = nullptr; }
              g_chat_templates.reset();
              if (g_batch_initialized) { llama_batch_free(g_batch); g_batch = {}; g_batch_initialized = false; }
              if (g_context != nullptr) { llama_free(g_context); g_context = nullptr; }
              if (g_model != nullptr) { llama_model_free(g_model); g_model = nullptr; }
          }'''
          if old_unload not in s: raise SystemExit('unload block missing')
          s=s.replace(old_unload,new_unload,1)

          marker='Java_com_arm_aichat_internal_InferenceEngineImpl_processUserPrompt'
          pos=s.find(marker)
          head, tail = s[:pos], s[pos:]
          tail=tail.replace('const bool has_chat_template = common_chat_templates_was_explicit(g_chat_templates.get());',
                            'const bool has_chat_template = false; // Lite13 raw MT prompt',1)
          tail=tail.replace('common_tokenize(g_context, formatted_user_prompt, has_chat_template, has_chat_template)',
                            'common_tokenize(g_context, formatted_user_prompt, false, true)',1)
          p.write_text(head+tail)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt')
          s=p.read_text()
          s=s.replace('''    @FastNative
              private external fun load(modelPath: String): Int

              @FastNative
              private external fun prepare(): Int''','''    @FastNative
              private external fun load(modelPath: String): Int

              @FastNative
              private external fun lastNativeError(): String

              @FastNative
              private external fun prepare(): Int''',1)
          s=s.replace('''                load(pathToModel).let {
                          // TODO-han.yin: find a better way to pass other error codes
                          if (it != 0) throw UnsupportedArchitectureException()
                      }''','''                load(pathToModel).let {
                          if (it != 0) {
                              val detail = lastNativeError().trim().takeLast(2400)
                              throw IOException("llama.cpp model load failed" + if (detail.isBlank()) "" else ": $detail")
                          }
                      }''',1)
          pattern = r'''is InferenceEngine\.State\.Error -> \{\s*Log\.i\(TAG, "Resetting error states\.\.\."\)\s*_state\.value = InferenceEngine\.State\.Initialized\s*Log\.i\(TAG, "States reset!"\)\s*Unit\s*\}'''
          repl='''is InferenceEngine.State.Error -> {
                    Log.i(TAG, "Cleaning resources from failed/partial model load...")
                    _readyForSystemPrompt = false
                    unload()
                    _state.value = InferenceEngine.State.Initialized
                    Log.i(TAG, "Failed model resources cleaned; state reset!")
                    Unit
                }'''
          s,n=re.subn(pattern,repl,s,count=1)
          if n != 1: raise SystemExit(f'Error cleanup replacements={n}')
          p.write_text(s)
          PY

          cat > "$LIB/src/main/java/com/arm/aichat/TranslationBridge.kt" <<'KOT'
          package com.arm.aichat

          import android.content.Context
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.toList
          import kotlinx.coroutines.runBlocking

          class TranslationBridge private constructor(context: Context) {
              private val engine: InferenceEngine = AiChat.getInferenceEngine(context.applicationContext)

              private suspend fun awaitInitialized() {
                  val s = engine.state.first { it is InferenceEngine.State.Initialized || it is InferenceEngine.State.Error }
                  if (s is InferenceEngine.State.Error) engine.cleanUp()
                  engine.state.first { it is InferenceEngine.State.Initialized }
              }

              @Synchronized fun loadModel(path: String) = runBlocking { awaitInitialized(); engine.loadModel(path) }
              @Synchronized fun generateRaw(prompt: String, maxTokens: Int): String = runBlocking {
                  engine.sendUserPrompt(prompt, maxTokens).toList().joinToString("")
              }
              @Synchronized fun unload() {
                  when (engine.state.value) {
                      is InferenceEngine.State.ModelReady, is InferenceEngine.State.Error -> engine.cleanUp()
                      else -> Unit
                  }
              }
              companion object { @JvmStatic fun create(context: Context) = TranslationBridge(context) }
          }
          KOT

          grep -q 'lastNativeError' "$ENGINE"
          grep -q 'retrying without mmap' "$CPP"
          grep -q 'BATCH_SIZE              = 64' "$CPP"

          cd examples/llama.android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :lib:assembleRelease
          AAR=lib/build/outputs/aar/lib-release.aar
          test -f "$AAR"
          unzip -l "$AAR" | grep 'jni/arm64-v8a/libai-chat.so'
          cp "$AAR" "$GITHUB_WORKSPACE/RTranslator/app/libs/llama-android-lite10.aar"

      - name: Apply Lite13 patch chain
        shell: bash
        run: |
          set -euxo pipefail
          python3 rtranslator-lite/patch_low_memory.py RTranslator
          python3 rtranslator-lite/patch_lite5_identity.py RTranslator
          python3 rtranslator-lite/patch_lite6_real_downloader.py RTranslator
          python3 rtranslator-lite/patch_lite7_walkie_safety.py RTranslator
          python3 rtranslator-lite/patch_lite8_sherpa_asr.py RTranslator
          python3 rtranslator-lite/patch_lite9_runtime_fix.py RTranslator
          python3 rtranslator-lite/patch_lite10_llama_models.py RTranslator
          python3 rtranslator-lite/patch_lite11_documents_ocr.py RTranslator
          python3 rtranslator-lite/patch_lite12_llama_runtime_fix.py RTranslator
          python3 rtranslator-lite/patch_lite13_gguf_loader.py RTranslator
          grep -q 'applicationId "nie.translator.rtranslator.lite13"' RTranslator/app/build.gradle
          grep -q 'Invalid GGUF header' RTranslator/app/src/main/java/nie/translator/rtranslator/voice_translation/neural_networks/translation/LlamaCppTranslationEngine.java

      - name: Build and verify Lite13 APK
        shell: bash
        run: |
          set -euxo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > RTranslator/local.properties
          cd RTranslator
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          cd ..
          APK=RTranslator/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          rm -rf apkcheck && mkdir apkcheck
          unzip -q "$APK" -d apkcheck
          test -f apkcheck/lib/arm64-v8a/libai-chat.so
          test -f apkcheck/lib/arm64-v8a/libggml-cpu.so
          test -f apkcheck/assets/tessdata/eng.traineddata
          find apkcheck -name '*.dex' -print0 | xargs -0 strings > apk-strings.txt
          grep -q 'RTranslatorLite13' apk-strings.txt
          grep -q 'Invalid GGUF header' apk-strings.txt
          sha256sum "$APK" | tee APK-SHA256.txt
          cp "$APK" RTranslator-3.0.0-alpha3-lite13-gguf-loader-debug.apk

      - name: Upload Lite13 APK
        uses: actions/upload-artifact@v4
        with:
          name: RTranslator-3.0.0-alpha3-lite13-gguf-loader
          path: |
            RTranslator-3.0.0-alpha3-lite13-gguf-loader-debug.apk
            APK-SHA256.txt
          compression-level: 9
          retention-days: 14
