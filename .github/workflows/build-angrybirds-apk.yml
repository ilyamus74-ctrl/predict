name: Build Angry Birds arm64 APK

on:
  push:
    branches:
      - tmp-build-angrybirds-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Clone upstream source
        run: |
          git clone --depth 1 https://github.com/BigBIueWhale/angrybirds-8.0.3-arm64.git angrybirds

      - name: Prepare original APK
        working-directory: angrybirds
        run: |
          . port/prepare_inputs.sh
          prepare_inputs

      - name: Build toolchain image
        working-directory: angrybirds
        run: |
          docker build -t ab-port -f port/docker/Dockerfile.ab-port .

      - name: Build faithful arm64 APK
        working-directory: angrybirds
        run: |
          docker run --rm --network none -v "$PWD":/work ab-port bash /work/port/build_apk.sh

      - name: Verify APK hash and size
        working-directory: angrybirds
        run: |
          sha256sum out/angrybirds-8.0.3-arm64.apk
          test "$(sha256sum out/angrybirds-8.0.3-arm64.apk | awk '{print $1}')" = "16a21587f8b379b3a3a833f975f8f870c0376570cdb30065492dc27ff14a4164"
          ls -lh out/angrybirds-8.0.3-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: angrybirds-8.0.3-arm64
          path: angrybirds/out/angrybirds-8.0.3-arm64.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
