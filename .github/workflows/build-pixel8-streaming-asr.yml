name: Build Pixel 8 Nemotron Streaming APK

on:
  push:
    branches:
      - chatgpt/pixel8-nemotron-streaming-20261014
    paths:
      - 'pixel8-streaming-asr/**'
      - '.github/workflows/build-pixel8-streaming-asr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download pinned official sherpa-onnx Android AAR
        run: |
          mkdir -p pixel8-streaming-asr/app/libs
          curl --fail --location --retry 4 --retry-delay 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar" \
            --output pixel8-streaming-asr/app/libs/sherpa-onnx.aar
          test "$(stat -c%s pixel8-streaming-asr/app/libs/sherpa-onnx.aar)" -gt 40000000
          unzip -l pixel8-streaming-asr/app/libs/sherpa-onnx.aar | grep -q "classes.jar"
      - name: Build Android debug APK
        run: gradle -p pixel8-streaming-asr --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel8-Nemotron35-True-Streaming-v01-APK
          path: pixel8-streaming-asr/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
